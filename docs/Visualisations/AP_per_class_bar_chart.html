
<div style="padding: 1rem 0;">
  <div style="display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; font-size: 12px; color: var(--color-text-secondary);">
    <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #378ADD;"></span>Average Precision (AP)</span>
    <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 2px; border: 1.5px dashed #E24B4A;"></span>Weighted mAP = 0.7769</span>
  </div>
  <div style="position: relative; width: 100%; height: 320px;">
    <canvas id="apChart" role="img" aria-label="Bar chart of Average Precision per class. Car: 0.85, Van: 0.30, Truck: 1.00, Pedestrian: 0.00, Cyclist: 0.00. Weighted mAP is 0.78.">AP scores — Car: 0.8529, Van: 0.3026, Truck: 1.0000, Pedestrian: 0.0000, Cyclist: 0.0000. Weighted mAP: 0.7769.</canvas>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const ctx = document.getElementById('apChart');
const data = [0.8529, 0.3026, 1.0000, 0.0000, 0.0000];
const labels = ['Car', 'Van', 'Truck', 'Pedestrian', 'Cyclist'];
const barColors = data.map(v => v === 0 ? '#B4B2A9' : '#378ADD');

new Chart(ctx, {
  type: 'bar',
  data: {
    labels,
    datasets: [
      {
        label: 'AP',
        data,
        backgroundColor: barColors,
        borderRadius: 4,
        borderSkipped: false,
        barPercentage: 0.55,
      },
      {
        label: 'Weighted mAP',
        data: [0.7769, 0.7769, 0.7769, 0.7769, 0.7769],
        type: 'line',
        borderColor: '#E24B4A',
        borderDash: [6, 4],
        borderWidth: 1.5,
        pointRadius: 0,
        fill: false,
        tension: 0,
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: (ctx) => {
            if (ctx.dataset.type === 'line') return `Weighted mAP: ${ctx.parsed.y.toFixed(4)}`;
            return `AP: ${ctx.parsed.y.toFixed(4)}`;
          }
        }
      }
    },
    scales: {
      x: {
        ticks: { autoSkip: false, color: '#888780', font: { size: 13 } },
        grid: { display: false },
        border: { display: false }
      },
      y: {
        min: 0,
        max: 1.05,
        ticks: {
          stepSize: 0.2,
          color: '#888780',
          font: { size: 12 },
          callback: v => v.toFixed(1)
        },
        grid: { color: 'rgba(136,135,128,0.15)' },
        border: { display: false }
      }
    }
  }
});
</script>
